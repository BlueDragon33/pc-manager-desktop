name: Preview Windows package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preview-package-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build unsigned preview installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head (not synthetic PR merge ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $expected = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $expected) { throw "Candidate checkout mismatch: $actual != $expected" }
          Write-Host "PASS P22 exact source checkout $actual"

      - name: Parse PowerShell Windows acceptance scripts before expensive builds
        shell: pwsh
        run: |
          foreach ($script in @('scripts/test-offline-nsis-install.ps1', 'scripts/test-offline-desktop-runtime.ps1', 'scripts/assert-nsis-upgrade-preflight.ps1', 'scripts/test-nsis-upgrade-preflight.ps1', 'scripts/invoke-pinned-nsis-candidate.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Host "PARSER ERROR $script : $($_.Message)" }
              throw "PowerShell parse gate failed: $script"
            }
            Write-Host "PASS PowerShell parse : $script"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run governance and tests
        shell: pwsh
        run: |
          npm run constitution:check
          node --test scripts/check-constitution.test.mjs
          npm run lint
          npm run typecheck
          npm run test
          cargo fmt --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Build real older main source NSIS (P22 baseline, CI-only)
        shell: pwsh
        run: |
          # Immutable known-good main preceding this P22 PR, not a same-source override.
          $baselineRevision = '83645a56987666144020dbdc85b3eec12815d003'
          $candidateRevision = (git rev-parse HEAD).Trim()
          if ($candidateRevision -ceq $baselineRevision) { throw 'P22 demands two distinct source SHAs.' }
          git fetch --no-tags --depth=1 origin $baselineRevision
          if ($LASTEXITCODE -ne 0) { throw 'Pinned older source fetch failed.' }
          $baselineWorktree = Join-Path $env:RUNNER_TEMP 'pc-manager-p22-older-source'
          git worktree add --detach $baselineWorktree $baselineRevision
          if ($LASTEXITCODE -ne 0) { throw 'Older source worktree creation failed.' }
          $readback = (git -C $baselineWorktree rev-parse HEAD).Trim()
          if ($readback -cne $baselineRevision) { throw 'Older source SHA readback mismatch.' }
          $changedAppPaths = @(git diff --name-only $baselineRevision $candidateRevision -- apps/desktop/src apps/desktop/src-tauri/src crates)
          if ($LASTEXITCODE -ne 0 -or $changedAppPaths.Count -eq 0) {
            throw 'P22 requires source changes in app/runtime code, not installer metadata alone.'
          }
          if ('apps/desktop/src/App.tsx' -cnotin $changedAppPaths) {
            throw 'P22 candidate is missing the expected offline Settings source change.'
          }
          $baseVersion = [version](Get-Content (Join-Path $baselineWorktree 'apps/desktop/src-tauri/tauri.conf.json') -Raw | ConvertFrom-Json).version
          $candidateDeclaredVersion = [version](Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          if ($baseVersion -ne $candidateDeclaredVersion) {
            throw 'P22 temporary candidate label expects unchanged declared app version.'
          }
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target'
          Push-Location $baselineWorktree
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Pinned older-source npm ci failed.' }
            npm --workspace @pc-manager/desktop run tauri -- build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw 'Pinned older-source NSIS build failed.' }
          } finally {
            Pop-Location
          }
          $oldInstaller = Get-ChildItem (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -File -Filter '*_x64-setup.exe' |
            Where-Object { $_.Name -cmatch "_$([regex]::Escape($baseVersion.ToString()))_x64-setup[.]exe$" } | Select-Object -First 1
          if (-not $oldInstaller) { throw 'Pinned old NSIS installer not found.' }
          $oldExe = Join-Path $env:CARGO_TARGET_DIR 'release/pc-manager-desktop.exe'
          if (-not (Test-Path -LiteralPath $oldExe -PathType Leaf)) { throw 'Older-source executable not built.' }
          $stageDir = Join-Path $env:RUNNER_TEMP 'pc-manager-p22-baseline'
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -LiteralPath $oldInstaller.FullName -Destination (Join-Path $stageDir $oldInstaller.Name)
          $exeSha = (Get-FileHash -LiteralPath $oldExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $stageDir 'baseline-executable.sha256') -Value $exeSha -Encoding ascii
          # Only one independent historical source checkout; no historical package in Preview artifacts.
          git worktree remove --force $baselineWorktree
          if ($LASTEXITCODE -ne 0) { throw 'Temporary baseline checkout cleanup failed.' }

      - name: Build source-changing candidate NSIS Preview (P22)
        shell: pwsh
        run: |
          $baseVersion = [version](Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nextVersion = "$($baseVersion.Major).$($baseVersion.Minor).$($baseVersion.Build + 1)"
          $configPath = Join-Path $env:RUNNER_TEMP 'pc-manager-p22-dev-version.json'
          @{version=$nextVersion} | ConvertTo-Json -Compress | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          # Recompile candidate desktop package and embed current PR frontend dist.
          cargo clean -p pc-manager-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Cannot clean candidate desktop binary before rebuild.' }
          npm --workspace @pc-manager/desktop run tauri -- build --bundles nsis --config $configPath
          if ($LASTEXITCODE -ne 0) { throw 'P22 different-source candidate NSIS build failed.' }
          $candidate = Get-ChildItem target/release/bundle/nsis/*.exe |
            Where-Object { $_.Name -cmatch "_$([regex]::Escape($nextVersion))_x64-setup[.]exe$" } | Select-Object -First 1
          if (-not $candidate) { throw 'P22 newer-source NSIS candidate not found.' }
          $candidateExe = 'target/release/pc-manager-desktop.exe'
          if (-not (Test-Path -LiteralPath $candidateExe -PathType Leaf)) { throw 'Candidate native exe not found.' }
          $stageDir = Join-Path $env:RUNNER_TEMP 'pc-manager-p22-candidate'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -LiteralPath $candidate.FullName -Destination (Join-Path $stageDir $candidate.Name)
          $candidateExeSha = (Get-FileHash -LiteralPath $candidateExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $stageDir 'candidate-executable.sha256') -Value $candidateExeSha -Encoding ascii
          $baselineExeSha = (Get-Content (Join-Path $env:RUNNER_TEMP 'pc-manager-p22-baseline/baseline-executable.sha256') -Raw).Trim()
          if ($baselineExeSha -ceq $candidateExeSha) { throw 'P22 executable bytes unchanged across different app sources.' }
          $baselineRevision = '83645a56987666144020dbdc85b3eec12815d003'
          $candidateRevision = (git rev-parse HEAD).Trim()
          $changedAppFiles = @(git diff --name-only $baselineRevision $candidateRevision -- apps/desktop/src apps/desktop/src-tauri/src crates)
          if ($LASTEXITCODE -ne 0 -or 'apps/desktop/src/App.tsx' -cnotin $changedAppFiles) {
            throw 'Cannot attest candidate application-source difference.'
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          [pscustomobject]@{
            schema = 'pc-manager.two-source-build/v1'
            checkoutRevision = $candidateRevision
            fromSourceRevision = $baselineRevision
            toSourceRevision = $candidateRevision
            changedAppFiles = @($changedAppFiles)
            fromVersion = $baseVersion.ToString()
            toVersion = $nextVersion
            baselineExecutableSha256 = $baselineExeSha
            candidateExecutableSha256 = $candidateExeSha
            sameSourceCode = $false
            sourceChanged = $true
            signedTrustVerified = $false
            realUserWindowsAccepted = $false
            success = $true
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts/offline-two-source-build-evidence.json -Encoding utf8
          Copy-Item -LiteralPath $candidate.FullName -Destination artifacts
          @(
            'UNSIGNED PREVIEW - NOT PRODUCTION; NO SIGNATURE TRUST',
            "Candidate source HEAD: $(git rev-parse HEAD)",
            'Historical baseline source: 83645a56987666144020dbdc85b3eec12815d003',
            "Temporary NSIS candidate version label: $nextVersion; declared repository version remains $baseVersion",
            'Two genuine app source revisions. Neither installer is signed or approved for users.'
          ) | Set-Content artifacts/UNSIGNED_PREVIEW.txt
      - name: Verify real NSIS install and offline protocol lifecycle on disposable Windows
        shell: pwsh
        run: |
          $baselineRevision = '83645a56987666144020dbdc85b3eec12815d003'
          $revision = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          if ((git rev-parse HEAD).Trim() -cne $revision) { throw 'P22 candidate HEAD changed.' }
          $installer = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'pc-manager-p22-baseline') -File -Filter '*_x64-setup.exe' | Select-Object -First 1
          $upgrade = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'pc-manager-p22-candidate') -File -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer -or -not $upgrade) { throw 'P22 different-source installer pair not staged.' }
          $upgradeHash = (Get-FileHash -LiteralPath $upgrade.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $baselineExeHash = (Get-Content (Join-Path $env:RUNNER_TEMP 'pc-manager-p22-baseline/baseline-executable.sha256') -Raw).Trim()
          $candidateExeHash = (Get-Content (Join-Path $env:RUNNER_TEMP 'pc-manager-p22-candidate/candidate-executable.sha256') -Raw).Trim()
          ./scripts/test-offline-nsis-install.ps1 -InstallerPath $installer.FullName -RuntimeEvidencePath artifacts/offline-runtime-evidence.json -RepairEvidencePath artifacts/offline-repair-runtime-evidence.json -UpgradeInstallerPath $upgrade.FullName -UpgradeEvidencePath artifacts/offline-version-transition-evidence.json -ExpectedUpgradeSha256 $upgradeHash -PreflightEvidencePath artifacts/offline-preflight-evidence.json -SourceRevision $revision -BaselineSourceRevision $baselineRevision -CandidateSourceRevision $revision -ExpectedBaselineExeSha256 $baselineExeHash -ExpectedCandidateExeSha256 $candidateExeHash -ExpectedUpgradeMarker 'Offline-first state on this device'

      - name: Generate preview metadata and checksums
        shell: pwsh
        run: |
          node scripts/generate-release-metadata.mjs --dir artifacts --channel dev --signed false --output artifacts/update-metadata.json
          Get-FileHash artifacts/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-manager-windows-unsigned-preview
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-manager-offline-runtime-evidence
          path: |
            artifacts/offline-runtime-evidence.json
            artifacts/offline-repair-runtime-evidence.json
            artifacts/offline-version-transition-evidence.json
            artifacts/offline-preflight-evidence.json
            artifacts/offline-preflight-evidence.json.uia.json
            artifacts/offline-two-source-build-evidence.json
          if-no-files-found: warn
          retention-days: 14
