name: Preview Windows package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preview-package-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build unsigned preview installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell Windows acceptance scripts before expensive builds
        shell: pwsh
        run: |
          foreach ($script in @('scripts/test-offline-nsis-install.ps1', 'scripts/test-offline-desktop-runtime.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Host "PARSER ERROR $script : $($_.Message)" }
              throw "PowerShell parse gate failed: $script"
            }
            Write-Host "PASS PowerShell parse : $script"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run governance and tests
        shell: pwsh
        run: |
          npm run constitution:check
          node --test scripts/check-constitution.test.mjs
          npm run lint
          npm run typecheck
          npm run test
          cargo fmt --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Build unsigned NSIS preview
        shell: pwsh
        run: |
          npm --workspace @pc-manager/desktop run tauri -- build --bundles nsis
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | Copy-Item -Destination artifacts
          "UNSIGNED PREVIEW BUILD - DO NOT DISTRIBUTE AS PRODUCTION" | Set-Content artifacts/UNSIGNED_PREVIEW.txt

      - name: Build disposable higher-version unsigned NSIS package (P19 pilot)
        shell: pwsh
        run: |
          $baseVersion = [version](Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nextVersion = "$($baseVersion.Major).$($baseVersion.Minor).$($baseVersion.Build + 1)"
          $configPath = Join-Path $env:RUNNER_TEMP 'pc-manager-p19-version-only.json'
          @{version=$nextVersion} | ConvertTo-Json -Compress | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          npm --workspace @pc-manager/desktop run tauri -- build --bundles nsis --config $configPath
          if ($LASTEXITCODE -ne 0) { throw 'P19 version-override build failed.' }
          $candidate = Get-ChildItem target/release/bundle/nsis/*.exe | Where-Object { $_.Name -match "_$([regex]::Escape($nextVersion))_x64-setup\.exe$" } | Select-Object -First 1
          if (-not $candidate) { throw "P19 unsigned candidate package not found for version $nextVersion." }
          $stageDir = Join-Path $env:RUNNER_TEMP 'pc-manager-p19-candidate'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -LiteralPath $candidate.FullName -Destination (Join-Path $stageDir $candidate.Name)
          # The candidate lives only in RUNNER_TEMP, never in distributable Preview artifacts.

      - name: Verify real NSIS install and offline protocol lifecycle on disposable Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Unsigned preview installer missing.' }
          $revision = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $upgrade = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'pc-manager-p19-candidate') -File -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $upgrade) { throw 'P19 candidate was not staged for testing.' }
          ./scripts/test-offline-nsis-install.ps1 -InstallerPath $installer.FullName -RuntimeEvidencePath artifacts/offline-runtime-evidence.json -RepairEvidencePath artifacts/offline-repair-runtime-evidence.json -UpgradeInstallerPath $upgrade.FullName -UpgradeEvidencePath artifacts/offline-version-transition-evidence.json -SourceRevision $revision

      - name: Generate preview metadata and checksums
        shell: pwsh
        run: |
          node scripts/generate-release-metadata.mjs --dir artifacts --channel dev --signed false --output artifacts/update-metadata.json
          Get-FileHash artifacts/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-manager-windows-unsigned-preview
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-manager-offline-runtime-evidence
          path: |
            artifacts/offline-runtime-evidence.json
            artifacts/offline-repair-runtime-evidence.json
            artifacts/offline-version-transition-evidence.json
          if-no-files-found: warn
          retention-days: 14
