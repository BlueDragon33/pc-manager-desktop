name: Universal Constitution Compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constitution:
    uses: BlueDragon33/Software-Blueprint-Hub/.github/workflows/constitution-compliance.yml@main

  dependency-sovereignty:
    name: PC Manager dependency sovereignty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local authority and dependency budget
        run: node scripts/check-constitution.mjs

      - name: Regression tests for local authority policy
        run: node --test scripts/check-constitution.test.mjs
