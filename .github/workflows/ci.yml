name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build:frontend

      - name: Show P4B formatting diff
        run: |
          npx prettier --write apps/desktop/src/smartClean.ts apps/desktop/src/SmartCleanPage.tsx apps/desktop/src/RestoreCenterPage.tsx apps/desktop/src/styles.css apps/desktop/src/App.tsx
          git diff -- apps/desktop/src/smartClean.ts apps/desktop/src/SmartCleanPage.tsx apps/desktop/src/RestoreCenterPage.tsx apps/desktop/src/styles.css apps/desktop/src/App.tsx
          git checkout -- apps/desktop/src/smartClean.ts apps/desktop/src/SmartCleanPage.tsx apps/desktop/src/RestoreCenterPage.tsx apps/desktop/src/styles.css apps/desktop/src/App.tsx

      - name: Check formatting
        run: npm run format:check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-native-build:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test Windows inventory provider
        run: cargo test -p pc-windows --locked

      - name: Build native application
        run: npm run build
