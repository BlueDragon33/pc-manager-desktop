name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (critical severity)
        run: npm audit --audit-level=critical

      - name: Validate release acceptance evidence
        run: |
          node scripts/check-release-acceptance.mjs --validate
          node --test scripts/check-release-acceptance.test.mjs

      - name: Constitution 1.2 governance
        run: npm run constitution:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build:frontend

      - name: Check formatting
        run: |
          npm run format:check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-native-build:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test Windows inventory provider
        run: cargo test -p pc-windows --locked

      - name: Build native application
        run: npm run build

  p14-lockfile-repair:
    name: One-time targeted Vitest lock regeneration
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'BlueDragon33/pc-manager-desktop' && github.head_ref == 'fix/p14-dependency-security-audit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dedicated remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/p14-dependency-security-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate only Vitest and required lockfile dependencies
        run: npm install --workspace @pc-manager/desktop --save-dev --package-lock-only --ignore-scripts 'vitest@^5.0.3'

      - name: Refuse remaining critical npm advisories
        run: npm audit --audit-level=critical

      - name: Commit targeted remediation, if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/desktop/package.json package-lock.json
          git commit -m 'fix(P14): upgrade Vitest toolchain past critical tinypool advisories'
          git push origin HEAD:refs/heads/fix/p14-dependency-security-audit
